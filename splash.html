<!doctype html>
<html lang="en" data-theme="dark" data-accent="aurora">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift3D</title>
  </head>
  <body>
    <main class="splash" aria-label="Shift3D is starting">
      <div class="glow"></div>
      <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sg" x1="10" y1="58" x2="54" y2="6" gradientUnits="userSpaceOnUse">
            <stop offset="0" class="stop-from" />
            <stop offset="1" class="stop-to" />
          </linearGradient>
        </defs>
        <g class="solid">
          <path d="M32 6 L54 18.5 L32 31 Z" fill="url(#sg)" />
          <path d="M32 31 L54 18.5 L54 45.5 L32 58 Z" fill="url(#sg)" />
          <path d="M32 31 L54 18.5 L54 45.5 L32 58 Z" fill="#000" fill-opacity=".28" />
          <path d="M32 6 L54 18.5 L32 31 Z" fill="#fff" fill-opacity=".14" />
        </g>
        <g class="wire" stroke="url(#sg)" stroke-linecap="round" stroke-linejoin="round">
          <path class="edge" d="M32 6 L10 18.5 L32 31 M10 18.5 L10 45.5 L32 58" stroke-width="2.4" pathLength="100" />
          <path class="edge" d="M10 18.5 L32 58" stroke-width="1.4" stroke-opacity=".55" pathLength="100" />
        </g>
        <g class="dots" fill="url(#sg)">
          <circle cx="10" cy="18.5" r="2.6" />
          <circle cx="10" cy="45.5" r="2.6" />
          <circle cx="32" cy="6" r="2.6" />
          <rect class="vox v1" x="25.4" y="34.6" width="3.6" height="3.6" rx=".6" />
          <rect class="vox v2" x="21.6" y="41.4" width="2.8" height="2.8" rx=".5" fill-opacity=".7" />
          <rect class="vox v3" x="26.6" y="46.2" width="2.4" height="2.4" rx=".4" fill-opacity=".45" />
        </g>
      </svg>
      <h1 class="wordmark">Shift<span>3D</span></h1>
      <p class="tagline">Shift ideas into 3D.</p>
      <div class="bar"><span></span></div>
    </main>
    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
