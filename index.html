<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflex</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f1117">
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --text:#f2f3f7; --muted:#8b90a3; --wait:#e5484d; --go:#30a46c; --idle:#3e63dd; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:20px; padding:16px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; user-select:none; }
  h1 { margin:0; font-size:2rem; letter-spacing:1px; }
  #box { width:min(520px,100%); height:300px; border-radius:20px; display:flex; flex-direction:column; align-items:center;
         justify-content:center; text-align:center; cursor:pointer; background:var(--idle); transition:background .1s; padding:16px; }
  #box.wait { background:var(--wait); }
  #box.go { background:var(--go); }
  #big { font-size:2.6rem; font-weight:800; }
  #small { font-size:1.1rem; opacity:.9; margin-top:8px; }
  .stats { display:flex; gap:12px; width:min(520px,100%); }
  .stat { flex:1; background:var(--card); border-radius:14px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:1.4rem; }
  .stat span { color:var(--muted); font-size:.85rem; }
  #history { color:var(--muted); font-size:.9rem; min-height:1.2em; text-align:center; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #install { color:var(--text); border-color:var(--go); }
  button, .btn { background:var(--card); color:var(--muted); border:1px solid #2a2e3d; border-radius:10px; padding:8px 14px; cursor:pointer;
                 font:inherit; font-size:.85rem; text-decoration:none; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <h1>⚡ Reflex</h1>
  <div id="box"><div id="big">Click to start</div><div id="small">Wait for green, then click fast!</div></div>
  <div class="stats">
    <div class="stat"><b id="last">–</b><span>Last</span></div>
    <div class="stat"><b id="avg">–</b><span>Avg (last 5)</span></div>
    <div class="stat"><b id="best">–</b><span>Best</span></div>
  </div>
  <div id="history"></div>
  <div class="buttons">
    <button id="reset">Reset best</button>
    <button id="install" hidden>⬇ Install app</button>
    <a id="download" class="btn" href="https://github.com/vcecho100-dot/idk/releases/latest/download/Reflex.exe">⬇ Download app</a>
  </div>

<script>
const box = document.getElementById('box'), big = document.getElementById('big'), small = document.getElementById('small');
let state = 'idle', timer = null, start = 0, times = [];
let best = null;
try { best = Number(localStorage.getItem('reflex-best')) || null; } catch (e) {}
showStats();

function rank(ms) {
  if (ms < 200) return '🐐 Pro gamer';
  if (ms < 250) return '🔥 Fast';
  if (ms < 300) return '👍 Solid';
  if (ms < 400) return '🙂 Average';
  return '🐢 Sleepy';
}

function set(cls, a, b) { box.className = cls; big.textContent = a; small.textContent = b; }

function press() {
  if (state === 'idle' || state === 'result') {
    state = 'wait';
    set('wait', 'Wait…', 'Don\'t click yet!');
    timer = setTimeout(() => { state = 'go'; start = performance.now(); set('go', 'CLICK!', ''); }, 1200 + Math.random() * 2800);
  } else if (state === 'wait') {
    clearTimeout(timer);
    state = 'result';
    set('', 'Too early! 😅', 'Click to try again');
  } else if (state === 'go') {
    const ms = Math.round(performance.now() - start);
    state = 'result';
    times.push(ms);
    if (best === null || ms < best) { best = ms; try { localStorage.setItem('reflex-best', ms); } catch (e) {} }
    set('', ms + ' ms', rank(ms) + ' · click to go again');
    showStats();
  }
}

function showStats() {
  const recent = times.slice(-5);
  document.getElementById('last').textContent = times.length ? times.at(-1) + ' ms' : '–';
  document.getElementById('avg').textContent = recent.length ? Math.round(recent.reduce((a, b) => a + b) / recent.length) + ' ms' : '–';
  document.getElementById('best').textContent = best ? best + ' ms' : '–';
  document.getElementById('history').textContent = recent.length ? 'Recent: ' + recent.join(' · ') : '';
}

box.addEventListener('pointerdown', press);
document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); press(); } });
document.getElementById('reset').onclick = () => { best = null; try { localStorage.removeItem('reflex-best'); } catch (e) {} showStats(); };

// Install as an app (works when hosted on GitHub Pages)
let installPrompt = null;
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
installBtn.onclick = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; installBtn.hidden = true; };
if (location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
} else {
  document.getElementById('download').hidden = true; // already downloaded
}
</script>
</body>
</html>
