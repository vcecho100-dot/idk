[package]
name = "shift3d"
version = "1.0.0"
description = "Shift ideas into 3D."
authors = ["vcecho100-dot"]
license = "MIT"
repository = "https://github.com/vcecho100-dot/idk"
edition = "2021"
rust-version = "1.80"

[lib]
name = "shift3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread", "fs"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream", "http2", "charset"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
trash = "5"
log = "0.4"
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Wdk_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
