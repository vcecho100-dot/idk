"$schema" = "../gen/schemas/acl-manifests.json"

[[set]]
identifier = "app-commands"
description = "Shift3D's typed commands for the main window. Network, keys, files and the database are only reachable through these."
permissions = [
  "allow-app-ready",
  "allow-set-window-appearance",
  "allow-get-settings",
  "allow-update-settings",
  "allow-system-info",
  "allow-open-external",
  "allow-reset-app-data",
  "allow-list-providers",
  "allow-set-provider-key",
  "allow-clear-provider-key",
  "allow-test-provider",
  "allow-provider-usage",
  "allow-probe-local-server",
  "allow-check-for-updates",
  "allow-install-update",
  "allow-generate",
  "allow-refine",
  "allow-retexture",
  "allow-rig",
  "allow-list-jobs",
  "allow-cancel-job",
  "allow-retry-job",
  "allow-dismiss-job",
  "allow-clear-finished-jobs",
  "allow-estimate-cost",
  "allow-list-projects",
  "allow-get-project",
  "allow-rename-project",
  "allow-set-favorite",
  "allow-set-tags",
  "allow-duplicate-project",
  "allow-delete-project",
  "allow-delete-version",
  "allow-set-current-version",
  "allow-create-version",
  "allow-save-thumbnail",
  "allow-pick-images",
  "allow-stage-image-bytes",
  "allow-import-model",
  "allow-open-project-file",
  "allow-save-project-file",
  "allow-export-files",
  "allow-save-media",
  "allow-send-to-godot",
  "allow-pick-godot-project",
  "allow-pick-blender-path",
  "allow-pick-output-dir",
  "allow-detect-blender",
  "allow-open-in-blender",
  "allow-reveal",
]
